name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: ./build.sh
      - name: Package
        run: ditto -c -k --keepParent build/Underrug.app Underrug.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # notes: this version's section of CHANGELOG.md
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" Underrug.zip --title "Underrug $v" --notes-file notes.md
